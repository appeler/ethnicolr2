name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Upload to PyPI. Only takes effect when the run is started from a tag;
          from a branch this is a build-and-check rehearsal.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: gojiplus/py-canon/.github/workflows/reusable-release.yml@v1
    permissions:
      contents: write
    with:
      github-release: ${{ github.event_name == 'push' }}

  publish:
    name: Publish to PyPI
    needs: release
    if: >-
      startsWith(github.ref, 'refs/tags/') &&
      (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish (trusted publishing, PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
          skip-existing: true
